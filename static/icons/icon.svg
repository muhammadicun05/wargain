<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wargain-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#043e2e" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="wargain-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Card -->
  <rect width="512" height="512" rx="112" fill="url(#wargain-bg)" />
  
  <!-- Inner Border Frame -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="4" />
  
  <!-- Inner Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="#047857" fill-opacity="0.12" filter="url(#shadow)" />
  
  <!-- Sleek Modern "W" Icon Emblem -->
  <path d="M 112 168 L 192 368 L 256 248 L 320 368 L 400 168"
        fill="none"
        stroke="#ffffff"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#shadow)" />
        
  <!-- Floating Emerald Accent Dot -->
  <circle cx="418" cy="148" r="22" fill="url(#wargain-accent)" filter="url(#shadow)" />
</svg>
