services:
  db:
    image: postgres:17-alpine
    container_name: wargain_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-wargain_v2}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: wargain_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-wargain-v2-production-secret-key-zyntaxera-2026}
      SECRET_KEY_BLIND: ${SECRET_KEY_BLIND:-blind-index-key-secret-2026-wargain-pdp-safe-9871}
      SECRET_KEY_DATA: ${SECRET_KEY_DATA:-data-encryption-aes-gcm-key-2026-wargain-secure-7621}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://*.ngrok-free.dev,https://*.ngrok-free.app}
      DB_NAME: ${DB_NAME:-wargain_v2}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_2026}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
